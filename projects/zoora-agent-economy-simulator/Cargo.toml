[package]
name = "zoora-agent-economy-simulator"
version = "0.2.0"
edition = "2021"
description = "Deterministic simulation laboratory for the Zoora agent economy"
license = "MIT"

[lib]
name = "zoora_agent_economy_simulator"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
toml = "0.8"
rand_chacha = "=0.3.1"
rand_core = "=0.6.4"
