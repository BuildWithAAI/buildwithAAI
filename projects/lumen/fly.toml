# Deploy later from this directory: fly deploy
# Do not put secrets in this file. Set them with fly secrets.
app = "lumen-tidepool"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "lumen_data"
  destination = "/data"

[env]
  LUMEN_DATA = "/data/lumen.sqlite"
  PORT = "3000"
