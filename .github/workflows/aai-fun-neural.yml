name: AAI.fun Native Neural Trade Learning
on:
  pull_request:
    paths:
      - "src/multi_brain_research/neural_features.py"
      - "src/ecosystem_research/**"
      - "scripts/ecosystem_worker.py"
      - "scripts/run_ecosystem_research.py"
      - "scripts/ecosystem_learning_worker.py"
      - "scripts/run_ecosystem_learning.py"
      - "tests/test_ecosystem_learning.py"
      - "scripts/ecosystem_behavior_worker.py"
      - "scripts/run_ecosystem_behavior.py"
      - "tests/test_behavior_learning.py"
      - "scripts/ecosystem_experience_worker.py"
      - "scripts/run_ecosystem_experience.py"
      - "tests/test_experience_learning.py"
      - "src/ecosystem_research/controller.py"
      - "scripts/ecosystem_controller_worker.py"
      - "scripts/run_ecosystem_controller.py"
      - "tests/test_controller_recovery.py"
      - "scripts/ecosystem_network_worker.py"
      - "scripts/run_ecosystem_network.py"
      - "tests/test_network_models.py"
      - "scripts/scanner_feed_worker.py"
      - "scripts/run_scanner_feed.py"
      - "tests/test_scanner_feed.py"
      - "scripts/research_services_worker.py"
      - "scripts/run_research_services.py"
      - "scripts/blueprint_exchange_*.py"
      - "tests/test_service_blueprints.py"
      - "tests/test_service_diagnostics.py"
      - "tests/test_research_services.py"
      - "tests/feed_fixtures.py"
      - "tests/fixtures/ecosystem-network-bundle.json"
      - "experiments/ecosystem_learning/**"
      - "scripts/capture_research_history.py"
      - "research/ecosystem/**"
      - "src/multi_brain_research/trade_learning.py"
      - "src/solana_research/source_history.py"
      - "scripts/collect_trade_history.py"
      - "scripts/train_trade_readout.py"
      - "scripts/run_flyvis_trade.py"
      - "experiments/brain_training/frozen_runtime.py"
      - "experiments/brain_training/trade_worker.py"
      - "experiments/brain_training/worker.py"
      - "tests/test_neural_trade.py"
      - "research/aai-fun/**"
      - ".github/workflows/aai-fun-neural.yml"
  push:
    branches: [main]
    paths:
      - "src/multi_brain_research/neural_features.py"
      - "src/ecosystem_research/**"
      - "scripts/ecosystem_worker.py"
      - "scripts/run_ecosystem_research.py"
      - "scripts/ecosystem_learning_worker.py"
      - "scripts/run_ecosystem_learning.py"
      - "tests/test_ecosystem_learning.py"
      - "scripts/ecosystem_behavior_worker.py"
      - "scripts/run_ecosystem_behavior.py"
      - "tests/test_behavior_learning.py"
      - "scripts/ecosystem_experience_worker.py"
      - "scripts/run_ecosystem_experience.py"
      - "tests/test_experience_learning.py"
      - "src/ecosystem_research/controller.py"
      - "scripts/ecosystem_controller_worker.py"
      - "scripts/run_ecosystem_controller.py"
      - "tests/test_controller_recovery.py"
      - "scripts/ecosystem_network_worker.py"
      - "scripts/run_ecosystem_network.py"
      - "tests/test_network_models.py"
      - "scripts/scanner_feed_worker.py"
      - "scripts/run_scanner_feed.py"
      - "tests/test_scanner_feed.py"
      - "scripts/research_services_worker.py"
      - "scripts/run_research_services.py"
      - "scripts/blueprint_exchange_*.py"
      - "tests/test_service_blueprints.py"
      - "tests/test_service_diagnostics.py"
      - "tests/test_research_services.py"
      - "tests/feed_fixtures.py"
      - "tests/fixtures/ecosystem-network-bundle.json"
      - "experiments/ecosystem_learning/**"
      - "scripts/capture_research_history.py"
      - "research/ecosystem/**"
      - "src/multi_brain_research/trade_learning.py"
      - "src/solana_research/source_history.py"
      - "scripts/collect_trade_history.py"
      - "scripts/run_flyvis_trade.py"
      - "experiments/brain_training/**"
      - "tests/test_neural_trade.py"
      - ".github/workflows/aai-fun-neural.yml"
permissions:
  contents: read
concurrency:
  group: aai-fun-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.16"
      - name: Install pinned development linter
        run: python -m pip install --disable-pip-version-check ruff==0.17.0
      - name: Check neural contract, integration and regression sources
        run: python -m ruff check --select E4,E7,E9,F,B src/multi_brain_research/neural_features.py src/multi_brain_research/trade_learning.py scripts/train_trade_readout.py scripts/run_flyvis_trade.py experiments/brain_training/frozen_runtime.py experiments/brain_training/worker.py experiments/brain_training/trade_worker.py tests/test_neural_trade.py
      - name: Strict normal and optimized contract regressions using explicitly fake activity vectors
        run: |
          python -bb -X dev -W error -m unittest discover -s tests -p test_neural_trade.py -v
          python -O -bb -X dev -W error -m unittest discover -s tests -p test_neural_trade.py -v
  actual-neural-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TuragaLab/flyvis
          ref: 0a69fa2fc8e1bfe1d837d722c252ab5f5d6fcbfa
          path: .flyvis-upstream
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: BuildWithAAI/buildwithAAI
          ref: 97108a271face220aef6296fddb2e18abdb210b5
          path: .ecosystem-scanner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: BuildWithAAI/buildwithAAI
          ref: fc42d8b36da77c58430e4a7594a30a0225883b6c
          path: .ecosystem-community
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Human-Agent-Society/reef
          ref: b8809cdcec899c7603708f6eaeddbb4955070043
          path: .ecosystem-reef
          persist-credentials: false
      - name: Capture real source observations for inference only
        run: |
          python scripts/capture_research_history.py --slots 3 --output research/aai-fun/generated/neural-capture
          python scripts/collect_trade_history.py verify --directory research/aai-fun/generated/neural-capture
          python scripts/collect_trade_history.py prepare --directory research/aai-fun/generated/neural-capture --output research/aai-fun/generated/neural-source
      - name: Install pinned dependency tooling
        run: "python -m pip install --require-hashes --only-binary=:all: -r experiments/flyvis_cpu_smoke/bootstrap-linux.lock"
      - name: Prepare existing hash-locked CPU environment
        run: |
          uv venv .flyvis-venv --python python --no-python-downloads
          uv pip sync experiments/flyvis_cpu_smoke/requirements-linux-py312.lock --python .flyvis-venv/bin/python --torch-backend cpu --require-hashes
          uv pip install --python .flyvis-venv/bin/python --no-deps --no-build-isolation ./.flyvis-upstream
      - name: Install the existing hash-locked community runtime for disposable local records
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r .ecosystem-community/projects/zoora-agent-community/requirements.lock
      - name: Prepare the separate hash-locked Reef CPU environment
        run: |
          uv venv .reef-venv --python python --no-python-downloads
          uv pip sync experiments/ecosystem_learning/requirements.lock --python .reef-venv/bin/python --require-hashes --only-binary=:all:
      - name: Actual neural inference and synthetic fitting, then native reexecution in another process
        run: python scripts/run_flyvis_trade.py --source .flyvis-upstream --python .flyvis-venv/bin/python --output research/aai-fun/generated/native-trade --real-source research/aai-fun/generated/neural-source
      - name: Independent standard-library readout replay; no native inference attestation from this verifier
        run: python scripts/train_trade_readout.py verify --directory research/aai-fun/generated/native-trade/neural-training
      - name: Connect actual source, scanner mint parsing, model forecasts and community jobs
        run: python scripts/run_ecosystem_research.py run --native-directory research/aai-fun/generated/native-trade --scanner-source .ecosystem-scanner --community-source .ecosystem-community --output research/ecosystem/generated/connected
      - name: Replay ecosystem reports and audit SQLite artifacts in another process without network
        run: python scripts/run_ecosystem_research.py verify --directory research/ecosystem/generated/connected --scanner-source .ecosystem-scanner --community-source .ecosystem-community
      - name: Prove changed reports, database bindings and public execution flags are rejected
        run: python scripts/run_ecosystem_research.py negative-checks --directory research/ecosystem/generated/connected --scanner-source .ecosystem-scanner --community-source .ecosystem-community
      - name: Learn advisory review workflows from the verified community artifact handoff
        run: python scripts/run_ecosystem_learning.py run --directory research/ecosystem/generated/learning --ecosystem-directory research/ecosystem/generated/connected --scanner-source .ecosystem-scanner --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python
      - name: Independently replay Reef records, evaluation and advisory releases
        run: python scripts/run_ecosystem_learning.py verify --directory research/ecosystem/generated/learning --ecosystem-directory research/ecosystem/generated/connected --scanner-source .ecosystem-scanner --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python
      - name: Reject altered policies, feedback and public flags even after outer hashes are updated
        run: python scripts/run_ecosystem_learning.py negative-checks --directory research/ecosystem/generated/learning --ecosystem-directory research/ecosystem/generated/connected --scanner-source .ecosystem-scanner --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python
      - name: Connect verified market outcomes and advisory review learning to specialist behavior jobs
        run: python -B scripts/run_ecosystem_behavior.py run --directory research/ecosystem/generated/behavior --ecosystem-directory research/ecosystem/generated/connected --learning-directory research/ecosystem/generated/learning --scanner-source .ecosystem-scanner --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python
      - name: Independently reconstruct simulator tasks, delayed price feedback, job audit and Reef selections
        run: python -B scripts/run_ecosystem_behavior.py verify --directory research/ecosystem/generated/behavior --ecosystem-directory research/ecosystem/generated/connected --learning-directory research/ecosystem/generated/learning --scanner-source .ecosystem-scanner --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python
      - name: Reject future labels, changed learned policies, feedback, receipts and public execution flags
        run: python -B scripts/run_ecosystem_behavior.py negative-checks --directory research/ecosystem/generated/behavior --ecosystem-directory research/ecosystem/generated/connected --learning-directory research/ecosystem/generated/learning --scanner-source .ecosystem-scanner --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python
      - name: Connect verified behavior history to shared experience and guarded advisory versions
        run: python -B scripts/run_ecosystem_experience.py run --directory research/ecosystem/generated/experience --behavior-directory research/ecosystem/generated/behavior --ecosystem-directory research/ecosystem/generated/connected --learning-directory research/ecosystem/generated/learning --scanner-source .ecosystem-scanner --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python
      - name: Independently replay shared admission, restart checkpoints, retention and contradiction guards
        run: python -B scripts/run_ecosystem_experience.py verify --directory research/ecosystem/generated/experience --behavior-directory research/ecosystem/generated/behavior --ecosystem-directory research/ecosystem/generated/connected --learning-directory research/ecosystem/generated/learning --scanner-source .ecosystem-scanner --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python
      - name: Reject rehashed journal poisoning, forged provenance and changed selected or guarded state
        run: python -B scripts/run_ecosystem_experience.py negative-checks --directory research/ecosystem/generated/experience --behavior-directory research/ecosystem/generated/behavior --ecosystem-directory research/ecosystem/generated/connected --learning-directory research/ecosystem/generated/learning --scanner-source .ecosystem-scanner --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python
      - name: Connect exclusive controller ownership, atomic memory checkpoints and cold-process restarts
        run: python -B scripts/run_ecosystem_controller.py run --directory research/ecosystem/generated/controller --experience-directory research/ecosystem/generated/experience --behavior-directory research/ecosystem/generated/behavior --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python --ecosystem-directory research/ecosystem/generated/connected --learning-directory research/ecosystem/generated/learning --scanner-source .ecosystem-scanner
      - name: Replay controller checkpoints and eight actual ownership and crash fault probes
        run: python -B scripts/run_ecosystem_controller.py verify --directory research/ecosystem/generated/controller --experience-directory research/ecosystem/generated/experience --behavior-directory research/ecosystem/generated/behavior --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python --ecosystem-directory research/ecosystem/generated/connected --learning-directory research/ecosystem/generated/learning --scanner-source .ecosystem-scanner
      - name: Reject rehashed checkpoint, rolled-back memory, changed plan and public guard
        run: python -B scripts/run_ecosystem_controller.py negative-checks --directory research/ecosystem/generated/controller --experience-directory research/ecosystem/generated/experience --behavior-directory research/ecosystem/generated/behavior --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python --ecosystem-directory research/ecosystem/generated/connected --learning-directory research/ecosystem/generated/learning --scanner-source .ecosystem-scanner
      - name: Transfer the actual selected models through authenticated HTTP and verified TLS
        run: python -B scripts/run_ecosystem_network.py run --directory research/ecosystem/generated/network --controller-directory research/ecosystem/generated/controller --experience-directory research/ecosystem/generated/experience --behavior-directory research/ecosystem/generated/behavior --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python --ecosystem-directory research/ecosystem/generated/connected --learning-directory research/ecosystem/generated/learning --scanner-source .ecosystem-scanner
      - name: Reconstruct the receiving agent outputs, source ancestry and audited job bindings
        run: python -B scripts/run_ecosystem_network.py verify --directory research/ecosystem/generated/network --controller-directory research/ecosystem/generated/controller --experience-directory research/ecosystem/generated/experience --behavior-directory research/ecosystem/generated/behavior --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python --ecosystem-directory research/ecosystem/generated/connected --learning-directory research/ecosystem/generated/learning --scanner-source .ecosystem-scanner
      - name: Reject changed transferred models, guard results, job bindings, observer authority and access claims
        run: python -B scripts/run_ecosystem_network.py negative-checks --directory research/ecosystem/generated/network --controller-directory research/ecosystem/generated/controller --experience-directory research/ecosystem/generated/experience --behavior-directory research/ecosystem/generated/behavior --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python --ecosystem-directory research/ecosystem/generated/connected --learning-directory research/ecosystem/generated/learning --scanner-source .ecosystem-scanner
      - name: Connect actual scanner HTTP observations and real provider reads to a separate agent
        run: python -B scripts/run_scanner_feed.py run --directory research/ecosystem/generated/scanner-feed --network-directory research/ecosystem/generated/network --controller-directory research/ecosystem/generated/controller --experience-directory research/ecosystem/generated/experience --behavior-directory research/ecosystem/generated/behavior --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python --ecosystem-directory research/ecosystem/generated/connected --learning-directory research/ecosystem/generated/learning --scanner-source .ecosystem-scanner
      - name: Replay raw scanner responses, freshness gates, source declarations and bound job reports
        run: python -B scripts/run_scanner_feed.py verify --directory research/ecosystem/generated/scanner-feed --network-directory research/ecosystem/generated/network --controller-directory research/ecosystem/generated/controller --experience-directory research/ecosystem/generated/experience --behavior-directory research/ecosystem/generated/behavior --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python --ecosystem-directory research/ecosystem/generated/connected --learning-directory research/ecosystem/generated/learning --scanner-source .ecosystem-scanner
      - name: Reject rehashed scanner projections, changed agent facts, job bindings, policy and authority
        run: python -B scripts/run_scanner_feed.py negative-checks --directory research/ecosystem/generated/scanner-feed --network-directory research/ecosystem/generated/network --controller-directory research/ecosystem/generated/controller --experience-directory research/ecosystem/generated/experience --behavior-directory research/ecosystem/generated/behavior --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python --ecosystem-directory research/ecosystem/generated/connected --learning-directory research/ecosystem/generated/learning --scanner-source .ecosystem-scanner
      - name: Connect scanner and model orders to atomic blueprint trials, withdrawal and buyer acceptance
        run: python -B scripts/run_research_services.py run --directory research/ecosystem/generated/services --feed-directory research/ecosystem/generated/scanner-feed --network-directory research/ecosystem/generated/network --controller-directory research/ecosystem/generated/controller --experience-directory research/ecosystem/generated/experience --behavior-directory research/ecosystem/generated/behavior --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python --ecosystem-directory research/ecosystem/generated/connected --learning-directory research/ecosystem/generated/learning --scanner-source .ecosystem-scanner
      - name: Replay work allowances, source-bound reports, actual job and artifact state, acceptance and shared audit
        run: python -B scripts/run_research_services.py verify --directory research/ecosystem/generated/services --feed-directory research/ecosystem/generated/scanner-feed --network-directory research/ecosystem/generated/network --controller-directory research/ecosystem/generated/controller --experience-directory research/ecosystem/generated/experience --behavior-directory research/ecosystem/generated/behavior --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python --ecosystem-directory research/ecosystem/generated/connected --learning-directory research/ecosystem/generated/learning --scanner-source .ecosystem-scanner
      - name: Reject changed service and blueprint histories, package bytes, price records and claimed authority
        run: python -B scripts/run_research_services.py negative-checks --directory research/ecosystem/generated/services --feed-directory research/ecosystem/generated/scanner-feed --network-directory research/ecosystem/generated/network --controller-directory research/ecosystem/generated/controller --experience-directory research/ecosystem/generated/experience --behavior-directory research/ecosystem/generated/behavior --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python --ecosystem-directory research/ecosystem/generated/connected --learning-directory research/ecosystem/generated/learning --scanner-source .ecosystem-scanner
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: aai-fun-actual-neural-trade-evidence
          path: |
            research/aai-fun/generated/native-trade/*.json
            research/aai-fun/generated/native-trade/*.log
            research/aai-fun/generated/native-trade/neural-training/*.json
            research/aai-fun/generated/native-trade/raw-control/*.json
            research/aai-fun/generated/native-trade/real-input/*.json
            research/aai-fun/generated/neural-capture/**/*.json
            research/aai-fun/generated/neural-capture-recovery.json
            research/aai-fun/generated/neural-source/*.json
            research/ecosystem/generated/connected/*.json
            research/ecosystem/generated/connected/*.log
            research/ecosystem/generated/connected/training/*.json
            research/ecosystem/generated/connected/target/*.json
            research/ecosystem/generated/connected/mint-capture/*.json
            research/ecosystem/generated/connected/state/community.sqlite3
            research/ecosystem/generated/learning/*.json
            research/ecosystem/generated/learning/*.log
            research/ecosystem/generated/learning/state/reef.sqlite3
            research/ecosystem/generated/behavior/*.json
            research/ecosystem/generated/behavior/*.log
            research/ecosystem/generated/behavior/agents/community.sqlite3
            research/ecosystem/generated/behavior/reef/records.sqlite3
            research/ecosystem/generated/experience/*.json
            research/ecosystem/generated/experience/*.log
            research/ecosystem/generated/experience/agents/community.sqlite3
            research/ecosystem/generated/experience/experience/journal.sqlite3
            research/ecosystem/generated/experience/reef/records.sqlite3
            research/ecosystem/generated/controller/*.json
            research/ecosystem/generated/controller/controller/journal.sqlite3
            research/ecosystem/generated/controller/controller/journal.sqlite3.lock
            research/ecosystem/generated/network/*.json
            research/ecosystem/generated/network/agents/community.sqlite3
            research/ecosystem/generated/scanner-feed/*.json
            research/ecosystem/generated/scanner-feed/http-feed/*.json
            research/ecosystem/generated/scanner-feed/http-feed/observations.sqlite3
            research/ecosystem/generated/scanner-feed/tls-feed/*.json
            research/ecosystem/generated/scanner-feed/tls-feed/observations.sqlite3
            research/ecosystem/generated/scanner-feed/agents/community.sqlite3
            research/ecosystem/generated/scanner-feed/scanner.sqlite3
            research/ecosystem/generated/services/*.json
            research/ecosystem/generated/services/agents/community.sqlite3
          retention-days: 30
