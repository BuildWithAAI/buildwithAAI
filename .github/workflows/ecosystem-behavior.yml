name: AAI Ecosystem Behavior Learning
on:
  pull_request:
    paths:
      - "src/ecosystem_research/**"
      - "scripts/ecosystem_behavior_worker.py"
      - "scripts/run_ecosystem_behavior.py"
      - "tests/test_behavior_learning.py"
      - "scripts/ecosystem_experience_worker.py"
      - "scripts/run_ecosystem_experience.py"
      - "tests/test_experience_learning.py"
      - "experiments/ecosystem_learning/**"
      - "research/ecosystem/**"
      - ".github/workflows/ecosystem-behavior.yml"
  push:
    branches: [main]
    paths:
      - "src/ecosystem_research/**"
      - "scripts/ecosystem_behavior_worker.py"
      - "scripts/run_ecosystem_behavior.py"
      - "tests/test_behavior_learning.py"
      - "scripts/ecosystem_experience_worker.py"
      - "scripts/run_ecosystem_experience.py"
      - "tests/test_experience_learning.py"
      - "experiments/ecosystem_learning/**"
      - "research/ecosystem/**"
      - ".github/workflows/ecosystem-behavior.yml"
permissions:
  contents: read
jobs:
  behavior:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install the pinned portable linter
        run: python -m pip install --disable-pip-version-check ruff==0.17.0
      - name: Lint behavior memory, specialist tasks and isolated drivers
        run: python -m ruff check --select E4,E7,E9,F,B src/ecosystem_research/behavior.py src/ecosystem_research/behavior_tasks.py src/ecosystem_research/experience.py src/ecosystem_research/experience_tasks.py scripts/ecosystem_behavior_worker.py scripts/run_ecosystem_behavior.py scripts/ecosystem_experience_worker.py scripts/run_ecosystem_experience.py tests/test_behavior_learning.py tests/test_experience_learning.py
      - name: Strict normal and optimized causal feedback and review regressions
        run: |
          python -bb -X dev -W error -m unittest discover -s tests -p test_behavior_learning.py -v
          python -O -bb -X dev -W error -m unittest discover -s tests -p test_behavior_learning.py -v
          python -bb -X dev -W error -m unittest discover -s tests -p test_experience_learning.py -v
          python -O -bb -X dev -W error -m unittest discover -s tests -p test_experience_learning.py -v
      - name: Verify native Windows explicitly rejects the Unix-only Reef worker
        if: runner.os == 'Windows'
        run: python -c "from src.ecosystem_research.reef_adapter import load_reef; from unittest import TestCase; TestCase().assertRaisesRegex(ValueError, 'REEF_POSIX_RUNTIME_REQUIRED', load_reef, '.ecosystem-reef')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: runner.os == 'Linux'
        with:
          repository: BuildWithAAI/buildwithAAI
          ref: fc42d8b36da77c58430e4a7594a30a0225883b6c
          path: .ecosystem-community
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: runner.os == 'Linux'
        with:
          repository: Human-Agent-Society/reef
          ref: b8809cdcec899c7603708f6eaeddbb4955070043
          path: .ecosystem-reef
          persist-credentials: false
      - name: Install the pinned community runtime and separate hash-locked Reef CPU runtime
        if: runner.os == 'Linux'
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r .ecosystem-community/projects/zoora-agent-community/requirements.lock
          python -m venv .reef-venv
          .reef-venv/bin/python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r experiments/ecosystem_learning/requirements.lock
      - name: Actual specialist jobs, simulator outcomes, Reef selection and five semantic tamper rejections
        if: runner.os == 'Linux'
        run: python -B scripts/run_ecosystem_behavior.py self-test --directory research/ecosystem/generated/behavior-fixture --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python
      - name: Independently verify the sealed synthetic package without mutating it
        if: runner.os == 'Linux'
        run: python -B scripts/run_ecosystem_behavior.py verify --synthetic-only --directory research/ecosystem/generated/behavior-fixture --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python
      - name: Connect shared experience, restart persistence, retention and contradiction guards
        if: runner.os == 'Linux'
        run: python -B scripts/run_ecosystem_experience.py run --synthetic-only --directory research/ecosystem/generated/experience-fixture --behavior-directory research/ecosystem/generated/behavior-fixture --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python
      - name: Independently replay the persisted journal and selected advisory models
        if: runner.os == 'Linux'
        run: python -B scripts/run_ecosystem_experience.py verify --synthetic-only --directory research/ecosystem/generated/experience-fixture --behavior-directory research/ecosystem/generated/behavior-fixture --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python
      - name: Reject rehashed false history, forged provenance, changed models, checkpoints and guard state
        if: runner.os == 'Linux'
        run: python -B scripts/run_ecosystem_experience.py negative-checks --synthetic-only --directory research/ecosystem/generated/experience-fixture --behavior-directory research/ecosystem/generated/behavior-fixture --community-source .ecosystem-community --reef-source .ecosystem-reef --reef-python .reef-venv/bin/python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && runner.os == 'Linux'
        with:
          name: behavior-contract-evidence-${{ matrix.os }}
          path: |
            research/ecosystem/generated/behavior-fixture/*.json
            research/ecosystem/generated/behavior-fixture/*.log
            research/ecosystem/generated/behavior-fixture/agents/community.sqlite3
            research/ecosystem/generated/behavior-fixture/reef/records.sqlite3
            research/ecosystem/generated/experience-fixture/*.json
            research/ecosystem/generated/experience-fixture/*.log
            research/ecosystem/generated/experience-fixture/agents/community.sqlite3
            research/ecosystem/generated/experience-fixture/experience/journal.sqlite3
            research/ecosystem/generated/experience-fixture/reef/records.sqlite3
          retention-days: 30
