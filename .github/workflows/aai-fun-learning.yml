name: AAI.fun Trade Learning
on:
  pull_request:
    paths:
      - "src/multi_brain_research/training_lab.py"
      - "src/multi_brain_research/trade_learning.py"
      - "src/multi_brain_research/trade_fixture.py"
      - "scripts/train_trade_readout.py"
      - "tests/test_trade_learning.py"
      - "research/aai-fun/**"
      - ".github/workflows/aai-fun-learning.yml"
  push:
    branches: [main]
    paths:
      - "src/multi_brain_research/training_lab.py"
      - "src/multi_brain_research/trade_learning.py"
      - "src/multi_brain_research/trade_fixture.py"
      - "scripts/train_trade_readout.py"
      - "tests/test_trade_learning.py"
      - ".github/workflows/aai-fun-learning.yml"
permissions:
  contents: read
concurrency:
  group: aai-fun-learning-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  learning:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.16"
      - name: Install pinned development linter
        run: python -m pip install --disable-pip-version-check ruff==0.17.0
      - name: Check fitting and trade-learning sources
        run: python -m ruff check --select E4,E7,E9,F,B src/multi_brain_research/training_lab.py src/multi_brain_research/trade_learning.py src/multi_brain_research/trade_fixture.py scripts/train_trade_readout.py tests/test_trade_learning.py
      - name: Strict normal and optimized leakage, lineage and fitting checks
        run: |
          python -bb -X dev -W error -m unittest discover -s tests -p test_trade_learning.py -v
          python -O -bb -X dev -W error -m unittest discover -s tests -p test_trade_learning.py -v
      - name: Fit synthetic trade control and independently replay all sources and parameters
        run: |
          python scripts/train_trade_readout.py demo --output research/aai-fun/generated/trade-control
          python scripts/train_trade_readout.py verify --directory research/aai-fun/generated/trade-control
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: aai-fun-trade-control-${{ matrix.os }}
          path: research/aai-fun/generated/trade-control/*.json
          retention-days: 30
  real-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.16"
      - name: Capture real source block without manufacturing missing supported trades
        run: python scripts/coin_evidence.py capture --blocks 1 --output research/aai-fun/generated/real-capture
      - name: Prepare and independently verify real source contract; no real-data fitting
        run: |
          python scripts/train_trade_readout.py prepare --archive research/aai-fun/generated/real-capture/archive.json --output research/aai-fun/generated/real-source
          python scripts/train_trade_readout.py verify-sources --directory research/aai-fun/generated/real-source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: aai-fun-real-source-contract
          path: |
            research/aai-fun/generated/real-capture/*.json
            research/aai-fun/generated/real-source/*.json
          retention-days: 30
