name: AAI Scanner Observation Feed
on:
  pull_request:
    paths:
      - "src/ecosystem_research/**"
      - "scripts/scanner_feed_worker.py"
      - "scripts/run_scanner_feed.py"
      - "tests/feed_fixtures.py"
      - "tests/test_scanner_feed.py"
      - "tests/fixtures/ecosystem-network-bundle.json"
      - "research/ecosystem/**"
      - ".github/workflows/ecosystem-scanner-feed.yml"
  push:
    branches: [main]
    paths:
      - "src/ecosystem_research/**"
      - "scripts/scanner_feed_worker.py"
      - "scripts/run_scanner_feed.py"
      - "tests/feed_fixtures.py"
      - "tests/test_scanner_feed.py"
      - "tests/fixtures/ecosystem-network-bundle.json"
      - "research/ecosystem/**"
      - ".github/workflows/ecosystem-scanner-feed.yml"
permissions:
  contents: read
jobs:
  scanner-feed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: BuildWithAAI/buildwithAAI
          ref: fc42d8b36da77c58430e4a7594a30a0225883b6c
          path: .ecosystem-community
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: BuildWithAAI/buildwithAAI
          ref: 97108a271face220aef6296fddb2e18abdb210b5
          path: .ecosystem-scanner
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install the existing hash-locked service runtime
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r .ecosystem-community/projects/zoora-agent-community/requirements.lock
      - name: Install pinned development linter
        run: python -m pip install --disable-pip-version-check ruff==0.17.0
      - name: Lint the scanner intake, agent handoff and source contract
        run: python -m ruff check --select E4,E7,E9,F,B src/ecosystem_research/scanner_feed.py src/ecosystem_research/scanner_client.py scripts/scanner_feed_worker.py scripts/run_scanner_feed.py tests/feed_fixtures.py tests/test_scanner_feed.py
      - name: Strict normal and optimized source, timestamp, restart and rejection regressions
        run: |
          python -bb -X dev -W error -m unittest discover -s tests -p test_scanner_feed.py -v
          python -O -bb -X dev -W error -m unittest discover -s tests -p test_scanner_feed.py -v
      - name: Actual scanner and community services with explicit untrusted synthetic providers
        run: python -B scripts/run_scanner_feed.py transport-self-test --directory research/ecosystem/generated/scanner-feed-contract --bundle-file tests/fixtures/ecosystem-network-bundle.json --trusted-controller-sha256 b521bad111dab36cc42d20bcc29d041d25b4f7f2cbcb39261bf8b65280991ecd --scanner-source .ecosystem-scanner --community-source .ecosystem-community
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: scanner-feed-transport-evidence-${{ matrix.os }}
          path: |
            research/ecosystem/generated/scanner-feed-contract/*.json
            research/ecosystem/generated/scanner-feed-contract/http-feed/*.json
            research/ecosystem/generated/scanner-feed-contract/http-feed/observations.sqlite3
            research/ecosystem/generated/scanner-feed-contract/tls-feed/*.json
            research/ecosystem/generated/scanner-feed-contract/tls-feed/observations.sqlite3
            research/ecosystem/generated/scanner-feed-contract/agents/community.sqlite3
            research/ecosystem/generated/scanner-feed-contract/scanner.sqlite3
          retention-days: 30
