name: Zoora Review Market
on:
  pull_request:
    paths:
      - "projects/zoora-agent-economy-simulator/**"
      - ".github/workflows/zoora-review-market.yml"
  push:
    branches: [main]
    paths:
      - "projects/zoora-agent-economy-simulator/**"
      - ".github/workflows/zoora-review-market.yml"
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/zoora-agent-economy-simulator/review
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Bootstrap formatting (removed before release candidate)
        run: cargo fmt --all
      - name: Archive formatter output for source-only import
        if: matrix.os == 'ubuntu-latest'
        run: python -c "import json,pathlib; p=pathlib.Path('target/validation-evidence'); p.mkdir(parents=True,exist_ok=True); (p/'formatted-source.json').write_text(json.dumps({str(f):f.read_text() for folder in ['src','tests'] for f in pathlib.Path(folder).rglob('*.rs')}))"
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --release --all-targets
      - run: cargo build --locked --release
      - name: CLI, replay, independent fingerprint and concurrent scaling
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/ci_evidence.py
      - name: Allocation, noncustodial transcript and verified viewer integration
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/allocation_evidence.py
      - name: Real Chrome viewer integration and screenshots
        if: matrix.os == 'ubuntu-latest'
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/viewer_browser.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: review-validation-${{ matrix.os }}
          path: projects/zoora-agent-economy-simulator/review/target/validation-evidence/
          retention-days: 14
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/zoora-agent-economy-simulator/review
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.99.0
      - run: cargo metadata --locked --format-version 1 > dependency-metadata.json
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --json > audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: review-dependency-audit
          path: projects/zoora-agent-economy-simulator/review/audit.json
          retention-days: 14
