name: SFP Offline Paper Lab
on:
  pull_request:
    paths:
      - "projects/sfp-paper-lab/**"
      - ".github/workflows/sfp-paper-lab.yml"
  push:
    branches: [main]
    paths:
      - "projects/sfp-paper-lab/**"
      - ".github/workflows/sfp-paper-lab.yml"
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12.15"
          - os: ubuntu-latest
            python: "3.14.8"
          - os: windows-latest
            python: "3.14.8"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    defaults:
      run:
        working-directory: projects/sfp-paper-lab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned development linter; runtime has no third-party dependencies
        run: python -m pip install --disable-pip-version-check ruff==0.17.0
      - run: python -m ruff check .
      - run: python -bb -X dev -W error -m unittest discover -s tests -v
      - run: python -O -bb -X dev -W error -m unittest discover -s tests
      - name: Actual offline CSV, CLI, deterministic replay and report acceptance
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -bb -X dev -W error scripts/acceptance.py
      - name: Frozen plan, chronological controls and complete portable study acceptance
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -bb -X dev -W error scripts/study_acceptance.py
      - name: Transactional notebook, original CSV receipts, retained evaluations and independent export replay
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -bb -X dev -W error scripts/notebook_acceptance.py
      - name: Offline raw provider source, quality and complete notebook integration acceptance
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -bb -X dev -W error scripts/provider_acceptance.py
      - name: Install pinned development browser for portable-report checks
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12.15'
        run: |
          npm install --prefix "$RUNNER_TEMP/bt006-ui" --no-save --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/bt006-ui/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Actual desktop and phone-sized portable-report checks
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12.15'
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: NODE_PATH="$RUNNER_TEMP/bt006-ui/node_modules" node scripts/check_study_ui.cjs
      - name: Actual desktop and phone-sized notebook history and navigation checks
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12.15'
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: NODE_PATH="$RUNNER_TEMP/bt006-ui/node_modules" node scripts/check_notebook_ui.cjs
      - name: Actual desktop and phone-sized source receipt and boundary checks
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12.15'
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: NODE_PATH="$RUNNER_TEMP/bt006-ui/node_modules" node scripts/check_source_ui.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sfp-paper-${{ matrix.os }}-${{ matrix.python }}
          path: projects/sfp-paper-lab/evidence-output/
          retention-days: 14
