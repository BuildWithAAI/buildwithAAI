name: SFP Offline Paper Lab
on:
  pull_request:
    paths:
      - "projects/sfp-paper-lab/**"
      - ".github/workflows/sfp-paper-lab.yml"
  push:
    branches: [main]
    paths:
      - "projects/sfp-paper-lab/**"
      - ".github/workflows/sfp-paper-lab.yml"
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12.15"
          - os: ubuntu-latest
            python: "3.14.8"
          - os: windows-latest
            python: "3.14.8"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    defaults:
      run:
        working-directory: projects/sfp-paper-lab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned development linter; runtime has no third-party dependencies
        run: python -m pip install --disable-pip-version-check ruff==0.17.0
      - run: python -m ruff check .
      - run: python -bb -X dev -W error -m unittest discover -s tests -v
      - run: python -O -bb -X dev -W error -m unittest discover -s tests
      - name: Actual offline CSV, CLI, deterministic replay and report acceptance
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -bb -X dev -W error scripts/acceptance.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sfp-paper-${{ matrix.os }}-${{ matrix.python }}
          path: projects/sfp-paper-lab/evidence-output/
          retention-days: 14
