name: AAI Ecosystem Reef Learning
on:
  pull_request:
    paths:
      - "src/ecosystem_research/**"
      - "scripts/ecosystem_learning_worker.py"
      - "scripts/run_ecosystem_learning.py"
      - "tests/test_ecosystem_learning.py"
      - "experiments/ecosystem_learning/**"
      - "research/ecosystem/**"
      - ".github/workflows/ecosystem-learning.yml"
  push:
    branches: [main]
    paths:
      - "src/ecosystem_research/**"
      - "scripts/ecosystem_learning_worker.py"
      - "scripts/run_ecosystem_learning.py"
      - "tests/test_ecosystem_learning.py"
      - "experiments/ecosystem_learning/**"
      - "research/ecosystem/**"
      - ".github/workflows/ecosystem-learning.yml"
permissions:
  contents: read
jobs:
  learning:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Human-Agent-Society/reef
          ref: b8809cdcec899c7603708f6eaeddbb4955070043
          path: .ecosystem-reef
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install the separate hash-locked CPU dependency closure
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r experiments/ecosystem_learning/requirements.lock
          python -m pip install --disable-pip-version-check ruff==0.17.0
      - name: Lint bounded learning, adapter and regressions
        run: python -m ruff check --select E4,E7,E9,F,B src/ecosystem_research/learning.py src/ecosystem_research/reef_adapter.py scripts/ecosystem_learning_worker.py scripts/run_ecosystem_learning.py tests/test_ecosystem_learning.py
      - name: Normal and optimized policy, source-binding and public-projection regressions
        run: |
          python -bb -X dev -W error -m unittest discover -s tests -p test_ecosystem_learning.py -v
          python -O -bb -X dev -W error -m unittest discover -s tests -p test_ecosystem_learning.py -v
      - name: Actual pinned Reef storage, selection, independent replay and changed-package rejection
        run: python scripts/run_ecosystem_learning.py self-test --directory research/ecosystem/generated/reef-fixture --reef-source .ecosystem-reef
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: reef-contract-evidence-${{ matrix.os }}
          path: |
            research/ecosystem/generated/reef-fixture/*.json
            research/ecosystem/generated/reef-fixture/*.log
            research/ecosystem/generated/reef-fixture/state/reef.sqlite3
          retention-days: 30
