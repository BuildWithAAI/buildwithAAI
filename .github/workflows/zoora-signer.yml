name: Zoora signer

on:
  push:
    branches: [main]
    paths:
      - "projects/zoora-signer/**"
      - ".github/workflows/zoora-signer.yml"
  pull_request:
    paths:
      - "projects/zoora-signer/**"
      - ".github/workflows/zoora-signer.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/zoora-signer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/zoora-signer/requirements-dev.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Mypy
        run: python -m mypy --strict src/zoora_signer
      - name: Pytest
        run: python -m pytest
      - name: Gitleaks
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            curl -sSfL -o gitleaks.zip "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip"
            unzip -o gitleaks.zip
            BIN=./gitleaks.exe
          else
            curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
            tar -xzf gitleaks.tar.gz
            BIN=./gitleaks
          fi
          "$BIN" detect --no-git --redact --source projects/zoora-signer --config projects/zoora-signer/.gitleaks.toml
      - name: pip-audit
        run: python -m pip_audit -r requirements.txt

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/zoora-signer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.2.2
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: zoora-signer --help
