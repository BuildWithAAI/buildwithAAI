name: Zoora signer

on:
  push:
    branches: [main]
    paths:
      - "projects/zoora-signer/**"
      - ".github/workflows/zoora-signer.yml"
  pull_request:
    paths:
      - "projects/zoora-signer/**"
      - ".github/workflows/zoora-signer.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/zoora-signer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/zoora-signer/requirements.lock.txt
      - name: Install
        run: python -m pip install --require-hashes -r requirements.lock.txt
      - name: README install on a fresh venv
        if: runner.os == 'Linux'
        run: |
          python -m venv "$RUNNER_TEMP/readme-venv"
          "$RUNNER_TEMP/readme-venv/bin/python" -m pip install --require-hashes -r requirements.lock.txt
          "$RUNNER_TEMP/readme-venv/bin/python" -m pip install --no-deps --no-build-isolation -e ".[dev]"
          "$RUNNER_TEMP/readme-venv/bin/zoora-signer" --help
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Mypy
        run: python -m mypy --strict src/zoora_signer
      - name: Pytest
        run: python -m pytest
      - name: Gitleaks
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            curl -sSfL -o gitleaks.zip "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip"
            python -c "import hashlib,pathlib; assert hashlib.sha256(pathlib.Path('gitleaks.zip').read_bytes()).hexdigest()=='d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e'"
            unzip -o gitleaks.zip
            BIN=./gitleaks.exe
          else
            curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
            python -c "import hashlib,pathlib; assert hashlib.sha256(pathlib.Path('gitleaks.tar.gz').read_bytes()).hexdigest()=='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'"
            tar -xzf gitleaks.tar.gz
            BIN=./gitleaks
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="$(git rev-parse origin/main)"; fi
          "$BIN" detect --redact --config projects/zoora-signer/.gitleaks.toml --log-opts="${BASE}..HEAD"
      - name: pip-audit
        run: python -m pip_audit -r requirements.lock.txt

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/zoora-signer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m build --no-isolation
      - run: |
          set -euo pipefail
          whl="$(ls dist/*.whl)"
          sha256sum "$whl" | tee wheel.sha256
          python -m pip install --no-deps "$whl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zoora-signer-wheel
          path: |
            projects/zoora-signer/dist/*.whl
            projects/zoora-signer/wheel.sha256
          if-no-files-found: error
      - run: zoora-signer --help

  validator:
    name: validator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/zoora-signer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock.txt
      - name: Install Solana CLI v4.4.1
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          curl -sSfL -o anza-install.sh "https://release.anza.xyz/v4.4.1/install"
          python -c "import hashlib,pathlib; assert hashlib.sha256(pathlib.Path('anza-install.sh').read_bytes()).hexdigest()=='21de1236fa39f6f0ad8b53968c6e80b530040bf88ab0557098f37e6becfadd2a'"
          sh anza-install.sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Unsigned local simulation
        run: python scripts/e2e_validator.py
