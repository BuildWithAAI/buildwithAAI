name: AAI Ecosystem Model Network
on:
  pull_request:
    paths:
      - ".gitattributes"
      - "src/ecosystem_research/**"
      - "scripts/ecosystem_network_worker.py"
      - "scripts/run_ecosystem_network.py"
      - "tests/test_network_models.py"
      - "tests/fixtures/ecosystem-network-bundle.json"
      - "tests/fixtures/NETWORK_BUNDLE.md"
      - "research/ecosystem/**"
      - ".github/workflows/ecosystem-network.yml"
  push:
    branches: [main]
    paths:
      - ".gitattributes"
      - "src/ecosystem_research/**"
      - "scripts/ecosystem_network_worker.py"
      - "scripts/run_ecosystem_network.py"
      - "tests/test_network_models.py"
      - "tests/fixtures/ecosystem-network-bundle.json"
      - "research/ecosystem/**"
      - ".github/workflows/ecosystem-network.yml"
permissions:
  contents: read
jobs:
  network:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: BuildWithAAI/buildwithAAI
          ref: fc42d8b36da77c58430e4a7594a30a0225883b6c
          path: .ecosystem-community
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install the existing hash-locked community runtime
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r .ecosystem-community/projects/zoora-agent-community/requirements.lock
      - name: Install the pinned development linter
        run: python -m pip install --disable-pip-version-check ruff==0.17.0
      - name: Lint the implemented service, agents and source-binding contracts
        run: python -m ruff check --select E4,E7,E9,F,B src/ecosystem_research/network.py scripts/ecosystem_network_worker.py scripts/run_ecosystem_network.py tests/test_network_models.py
      - name: Strict normal and optimized distribution and guard regressions
        run: |
          python -bb -X dev -W error -m unittest discover -s tests -p test_network_models.py -v
          python -O -bb -X dev -W error -m unittest discover -s tests -p test_network_models.py -v
      - name: Actual Waitress, separate agents, verified TLS, restart and ten denied operations
        run: python -B scripts/run_ecosystem_network.py transport-self-test --directory research/ecosystem/generated/network-contract --bundle-file tests/fixtures/ecosystem-network-bundle.json --trusted-controller-sha256 b521bad111dab36cc42d20bcc29d041d25b4f7f2cbcb39261bf8b65280991ecd --community-source .ecosystem-community
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: network-transport-evidence-${{ matrix.os }}
          path: |
            research/ecosystem/generated/network-contract/*.json
            research/ecosystem/generated/network-contract/agents/community.sqlite3
          retention-days: 30
