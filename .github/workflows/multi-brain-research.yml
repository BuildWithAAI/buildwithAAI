name: Multi-Brain Research Foundation
on:
  pull_request:
    paths:
      - "src/multi_brain_research/**"
      - "tests/test_multi_brain.py"
      - "tests/test_brain_consensus.py"
      - "scripts/run_research_tests.py"
      - "scripts/replay_brain_consensus.py"
      - "scripts/run_consensus_demo.py"
      - "research/consensus/**"
      - "research/MULTI_BRAIN_COORDINATOR.md"
      - "scripts/verify_brain_asset.py"
      - "research/brain-assets/**"
      - "research/MULTI_BRAIN_LIVE_PREP.md"
      - ".github/workflows/multi-brain-research.yml"
  push:
    branches: [main]
    paths:
      - "src/multi_brain_research/**"
      - "tests/test_multi_brain.py"
      - "tests/test_brain_consensus.py"
      - "scripts/run_research_tests.py"
      - "scripts/replay_brain_consensus.py"
      - "scripts/run_consensus_demo.py"
      - "research/consensus/**"
      - "research/MULTI_BRAIN_COORDINATOR.md"
      - "scripts/verify_brain_asset.py"
      - "research/brain-assets/**"
      - "research/MULTI_BRAIN_LIVE_PREP.md"
      - ".github/workflows/multi-brain-research.yml"
permissions:
  contents: read
jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - name: Run research tests; scanner runtime has its own supported matrix
        run: python scripts/run_research_tests.py
      - run: python -O scripts/run_research_tests.py
      - name: Replay nine synthetic consensus scenarios and compare audit bytes
        run: python scripts/run_consensus_demo.py --output research/consensus/generated/ci
      - name: Acquire pinned public FlyEM export, rebuild and independently audit
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/verify_brain_asset.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: measured-connectivity-${{ matrix.os }}
          path: research/brain-assets/generated/verified-import.json
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: consensus-watch-${{ matrix.os }}
          path: research/consensus/generated/ci/
          if-no-files-found: warn
          retention-days: 14
