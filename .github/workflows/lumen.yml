name: Lumen

on:
  pull_request:
    paths:
      - "projects/lumen/**"
      - ".github/workflows/lumen.yml"
  push:
    branches: [main]
    paths:
      - "projects/lumen/**"
      - ".github/workflows/lumen.yml"

permissions:
  contents: read

jobs:
  next-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/lumen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
