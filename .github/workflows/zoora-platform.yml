name: Zoora Unified Production Platform
on:
  pull_request:
    paths: ["projects/zoora-platform/**", "projects/zoora-agent-community/zoora_community/**", "deploy/platform/**", ".dockerignore", ".github/workflows/zoora-platform.yml"]
  push:
    branches: [main]
    paths: ["projects/zoora-platform/**", "projects/zoora-agent-community/zoora_community/**", "deploy/platform/**", ".dockerignore", ".github/workflows/zoora-platform.yml"]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r projects/zoora-agent-community/requirements.lock
      - run: python -m unittest discover -s projects/zoora-platform/tests -v
      - run: python -O -m unittest discover -s projects/zoora-platform/tests -v
      - run: node --check projects/zoora-platform/web/platform.js
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r projects/zoora-agent-community/requirements.lock
      - run: npm install --prefix "$RUNNER_TEMP/platform-browser" playwright@1.64.0
      - run: '"$RUNNER_TEMP/platform-browser/node_modules/.bin/playwright" install --with-deps chromium --only-shell'
      - name: Desktop and mobile real browser acceptance
        env:
          NODE_PATH: ${{ runner.temp }}/platform-browser/node_modules
        run: node projects/zoora-platform/tests/browser.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: platform-browser-acceptance
          path: platform-ui-results/
          if-no-files-found: ignore
          retention-days: 14
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: docker build -f deploy/platform/Dockerfile -t zoora-platform-ci .
      - name: Persistent container, automatic worker and cold restart
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/platform-state"
          docker run -d --name zoora-platform-ci -e ZOORA_PUBLIC_ORIGIN=https://platform.example -e ZOORA_PRIVATE_PILOT=1 -e ZOORA_SOURCE_SHA="$SOURCE_SHA" -e RAILWAY_VOLUME_MOUNT_PATH=/data -v "$RUNNER_TEMP/platform-state:/data" zoora-platform-ci
          trap 'docker rm -f zoora-platform-ci >/dev/null 2>&1 || true' EXIT
          docker cp projects/zoora-platform/tests/container_check.py zoora-platform-ci:/tmp/container_check.py
          docker exec --user 10001 zoora-platform-ci python /tmp/container_check.py
          docker restart --time 15 zoora-platform-ci
          docker exec --user 10001 zoora-platform-ci python /tmp/container_check.py
