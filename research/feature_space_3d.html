<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AAI fixture feature space</title>
  <style>body{margin:0;background:#111;color:#eee;font-family:sans-serif}#note{position:absolute;padding:12px}</style>
</head>
<body>
<div id="note">Fixture only. Red = adverse. Blue = not. Not a live market.</div>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
const points = [[-0.2,-0.2,-0.2,1],[-0.05,0.1,0,0],[0.15,0.2,0.1,0],[-0.4,-0.3,-0.25,1],[0,0,0,0],[-0.16,-0.05,-0.1,1],[0.3,0.1,0.2,0],[-0.22,-0.18,-0.12,1]];
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
camera.position.set(1.4, 1.1, 1.6);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AxesHelper(1));
for (const [x,y,z,label] of points) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.035, 16, 16),
    new THREE.MeshBasicMaterial({color: label ? 0xc0392b : 0x2980b9})
  );
  mesh.position.set(x*2, z*2, y*2);
  scene.add(mesh);
}
function frame(){ requestAnimationFrame(frame); scene.rotation.y += 0.004; renderer.render(scene, camera); }
frame();
</script>
</body>
</html>
