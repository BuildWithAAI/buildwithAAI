# AUDUSD empirical research. PAPER / HISTORICAL SIMULATION ONLY.
account: {currency: USD, starting_equity: 100.0}
pairs: [AUDUSD]
instruments:
  AUDUSD: {contract_size: 100000, pip_size: 0.0001, lot_step: 0.01, min_lot: 0.01, max_lot: 100, broker_symbol: "AUDUSD+"}
risk:
  risk_per_trade_pct: 1.0
  min_risk_pct: 1.0
  max_risk_pct: 3.0
  max_open_risk_pct: 3.0
  daily_loss_limit_pct: 6.0
  max_correlated_risk_pct: 3.0
  max_positions_per_usd_direction: 1
  kill_switch_drawdown_pct: 20.0
  kill_switch_flatten: true
  max_lot: 100
costs:
  # Scenarios: 8/11.5/15 spread in tenths of a pip (0.8/1.15/1.5 pips).
  # Assumptions, not confirmed Bybit contract costs.
  commission_per_lot_side: 3.5
  default: {spread_pips: 1.15, slippage_pips: 0.15, stop_slippage_pips: 0.25,
            swap_long_pct_pa: -1.5, swap_short_pct_pa: -1.0}
  per_pair:
    AUDUSD: {spread_pips: 1.15, slippage_pips: 0.15, stop_slippage_pips: 0.25,
             swap_long_pct_pa: -1.5, swap_short_pct_pa: -1.0}
data: {provider: dukascopy, store_dir: data, history: {H1: {start: "2008-01-01"}}}
backtest: {oos_fraction: 0.3}
reporting: {out_dir: reports, audit_path: audit/audit.jsonl, runs_dir: runs}
execution: {mode: paper, paper_state_dir: state/paper}
