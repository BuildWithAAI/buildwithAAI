# AAI unified pipeline config. PAPER TRADING ONLY. No exchange keys, no wallets.
[account]
starting_equity_usd = 10000.0
mode = "paper"            # the only supported mode; live execution is not implemented

[risk]
# Hard limits. risk_per_trade is a fraction of current equity.
min_risk_per_trade = 0.01       # 1%
max_risk_per_trade = 0.03       # 3%  -- absolute ceiling, enforced in code, cannot be raised by config
default_risk_per_trade = 0.01
max_total_open_risk = 0.06      # sum of open risk across all positions
max_open_positions = 6
daily_loss_limit = 0.05         # realized+unrealized drawdown vs start-of-day equity -> auto kill switch
max_drawdown_kill = 0.15        # equity drawdown from peak -> auto kill switch
max_idea_age_sec = 900          # ideas older than this are rejected as stale
min_reward_risk = 1.5           # target distance / stop distance, when a target is given
max_leverage = 5.0              # notional / equity per position
max_stop_distance_pct = 0.25    # stops wider than this (non-meme) are rejected
slippage_bps = 10
fee_bps = 6

[risk.sector_caps]            # max open risk per sector (fraction of equity)
solana_meme = 0.03
perps = 0.04
billy = 0.02
forex = 0.03
stocks = 0.03
# NOTE: 'longterm' is intentionally NOT a trading sector (see [longterm]); it is a separate capital bucket.

[risk.sector_max_risk_per_trade]  # per-sector override, still clamped to [min, 3%]
solana_meme = 0.01               # memes: full-loss assumption, keep small
perps = 0.02

[adapters.solana_meme]
enabled = true
repo_path = "/workspace/solana-meme-risk"
python = "python3"
timeout_sec = 600
buyers = 30
hops = 1
trace_limit = 20

[adapters.blofin]
enabled = true
base_url = "https://openapi.blofin.com"
timeout_sec = 10
candle_fallback = "binance_vision"   # Blofin /market/candles is intermittently Cloudflare-challenged (curl UA blocked; requests UA worked)
binance_vision_url = "https://data-api.binance.vision"

[adapters.billy]
enabled = true
repo_path = "/workspace/billy"

[adapters.trader_audit]
enabled = false                 # trader_audit.csv/.db not on this computer
path = ""

[adapters.terminal_hud]
enabled = false                 # external Flask app not on this computer
base_url = ""

[adapters.forex]
enabled = false                 # placeholder: MT5 EA bridge not built
[adapters.stocks]
enabled = false                 # placeholder

[store]
path = "data/aai.db"

[hud]
host = "127.0.0.1"
port = 0                        # 0 = pick a free port

# ---------------------------------------------------------------------------
# Long-term bucket (adopted from 2040 Future Agent proposal, 2026-11-01).
# Separate capital bucket: NOT sized by the 1-3% trading rule, NOT counted in trading open risk,
# daily loss, drawdown or kill switch. Emits DRAFT tickets only; Zoorped confirms and executes himself.
[longterm]
enabled = true
mode = "draft_tickets_only"        # no execution path exists
excluded_from_trading_risk = true
kill_switch_scope = "trading"      # trading kill switch can never create or block longterm tickets
leverage_allowed = false
review_cadence = "monthly_1st"
ticket_expiry_days = 14

# Account execution policy. Mirrored in the DB table lt_account_policies (locked by triggers).
# OnePay Roth: Zoorped buys everything himself. Agents are auditors only; no order tickets can exist for it.
[longterm.account_policies.onepay_roth]
owner = "user"
executor = "user"
agent_role = "auditor"
ticketing = "disabled"
# Whether the 10% total speculative cap applies to this account is Zoorped's OPEN decision.
# "informational" = report the speculative % but never as a hard breach; set to "hard" once he decides.
speculative_total_cap = "informational"

[longterm.stocks_2040]
accounts_priority = ["onepay_roth", "robinhood"]
core_symbol = "VTI"
core_target_pct = 60.0
core_band = [55.0, 65.0]
themes_target_pct = 40.0
sleeve_band_rel = 0.25
speculative_total_max_pct = 10.0
speculative_stop_add_pct = 3.0
speculative_trim_above_pct = 5.0
growth_single_max_pct = 5.0
megacap_overlap_max_pct = 7.0
megacap_overlap_symbols = ["NVDA", "TSLA", "SPCX"]
priority_names = { TMC = 1.5, SPCE = 1.0, SLDP = 1.0 }
# Per-name caps live in lt_targets.max_pct (COUR = 3.0, 'future of education' thesis, added 2026-11-02).
rebalance_with_new_money_first = true

[longterm.crypto_core]
symbols = ["BTC", "ETH", "SOL", "XRP", "GALA", "HYPE"]
speculative_watch = ["APE", "BAYC"]
never_fully_sell = true
recover_initials_on_strength = true
add_every_bear_cycle = true
cold_storage_default = "trezor"
exchange_spot_is_longterm = false  # DECISION NEEDED (Zoorped)

[intel]
# Institutional intel layer (aai/intel). Keyless public sources only; read-only; paper terminal.
# SEC EDGAR fair-access policy asks for a real contact in the User-Agent: set this to Zoorped's address.
sec_contact = "Zooratechnologies@gmail.com"
watchlist = ["AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "TSLA", "AVGO", "JPM", "COIN", "MSTR", "PLTR"]
# high-impact events in these currencies raise WARN (30 min) / HIGH (5 min) alarms; USD covers gold and US indices
calendar_countries = ["USD", "AUD"]
