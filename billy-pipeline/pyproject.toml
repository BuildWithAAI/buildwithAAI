[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "billy-pipeline"
version = "0.1.0"
description = "Research + paper-trading pipeline that turns @cryptoWZRD_ Daily Technical Outlook posts into structured signals, backtests them and emits risk-sized PAPER signals. No live trading."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "pandas>=2.1",
  "numpy>=1.26",
  "requests>=2.31",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
billy = "billy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: hits the public Binance market-data API (skipped unless BILLY_NETWORK_TESTS=1)"]

[tool.coverage.run]
source = ["billy"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
